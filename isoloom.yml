# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Metasploitable 3, Windows Server 2008 R2 machine (by Rapid7): an intentionally vulnerable
# Windows server with IIS, GlassFish, Jenkins, Struts, WordPress, ManageEngine, Elasticsearch and
# more. Source: https://github.com/rapid7/metasploitable3, vendored in metasploitable3/. Runs
# Rapid7's published box built from that source (rapid7/metasploitable3-win2k8, as upstream's
# Vagrantfile does), then upstream's first-boot steps (provision/startup.ps1). VM targets only.
# `isoloom run vagrant`, then `isoloom test vagrant`.
version: 1
name: metasploitable3-windows

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: { description: "This player's flag, written to C:\\ctf\\flag.txt on win2k8." }

networks:
  lab: { cidr: 10.60.83.0/24 }

machines:
  win2k8:
    # Windows Server 2008 R2 has no built-in OS name in Isoloom; the box is pinned in `overrides`.
    os: windows-server@2016
    networks: { lab: 10 }
    ports:
      ftp: 21
      ssh: 22
      iis: { port: 80, protocol: http }
      glassfish-admin: 4848
      manageengine: 8020
      manageengine-https: 8383
      glassfish: { port: 8080, protocol: http }
      struts: 8282
      jenkins: { port: 8484, protocol: http }
      wamp: { port: 8585, protocol: http }
      elasticsearch: { port: 9200, protocol: http }
    resources: { cpus: 2, memory_mb: 4096 }
    # The player's flag is staged for flag.ps1, which writes C:\ctf\flag.txt readable by
    # Administrators and SYSTEM only.
    files:
      - { path: 'C:\Windows\Temp\ctf_flag_main', input: CTF_FLAG_MAIN }
    app:
      # startup.ps1 is upstream's first-boot step; flag.ps1 then places the player's flag.
      steps:
        - run: provision/startup.ps1
        - run: provision/flag.ps1

overrides:
  vagrant:
    machines:
      win2k8:
        box: rapid7/metasploitable3-win2k8
        box_version: "0.1.0-weekly"
        winrm: plaintext

checks:
  - { name: iis answers, http: "http://win2k8/", wait: 600 }
  - { name: jenkins answers, tcp: "win2k8:8484", wait: 300 }
  - { name: ftp answers, tcp: "win2k8:21" }
  - { name: ssh answers, tcp: "win2k8:22" }
  - { name: glassfish admin answers, tcp: "win2k8:4848", wait: 300 }
  - { name: glassfish answers, tcp: "win2k8:8080" }
  - { name: manageengine answers, tcp: "win2k8:8020", wait: 300 }
  - { name: struts answers, tcp: "win2k8:8282", wait: 300 }
  - { name: wamp answers, tcp: "win2k8:8585" }
  - { name: elasticsearch answers, tcp: "win2k8:9200", wait: 300 }
  - checks/vulnerable-services.sh

message: |
  Metasploitable 3 (Windows Server 2008 R2) is up at {{ machines.win2k8.addresses.lab }}. Scan it:
  IIS, FTP, GlassFish, Jenkins, Apache Struts, WordPress on WAMP, ManageEngine Desktop Central,
  Elasticsearch and more. Get administrative control and read C:\ctf\flag.txt; fifteen card
  flags are hidden too.
